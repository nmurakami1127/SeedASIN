[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The real DB URL is read by env.py from the SEEDASIN_DATABASE_URL environment variable.
# The value below is just a placeholder (never used when that env var is set).
# NOTE: keep this file ASCII-only. Alembic reads alembic.ini with Python's "locale"
# encoding (configparser's encoding="locale"), which on a non-UTF-8-locale Windows
# machine (e.g. Japanese cp932) fails to decode non-ASCII bytes even though the file
# itself is valid UTF-8. Put any Japanese explanatory comments in env.py or the
# version scripts instead, where normal UTF-8 source encoding rules apply.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
